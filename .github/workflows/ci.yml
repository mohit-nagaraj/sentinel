name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: pnpm

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.3"
          tools: composer:2.10.3
          coverage: none

      - run: pnpm install --frozen-lockfile
      - run: composer validate --strict --working-dir tools/php-indexer
      - run: composer install --working-dir tools/php-indexer --no-interaction --no-plugins --no-scripts --prefer-dist
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm test:agent
      - run: pnpm test:graph
      - run: pnpm test:browser
      - run: pnpm build
