name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.name }}
    # PR checks already cover merge commits. Still run on direct pushes to main.
    if: github.event_name == 'pull_request' || !startsWith(github.event.head_commit.message, 'Merge pull request')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: quality
            command: pnpm format:check && pnpm lint && pnpm typecheck
            php: false
            playwright: false
          - name: test
            command: pnpm test
            php: false
            playwright: false
          - name: test-integration
            command: pnpm test:integration
            php: true
            playwright: true
          - name: test-agent
            command: pnpm test:agent
            php: false
            playwright: false
          - name: test-graph
            command: pnpm test:graph
            php: false
            playwright: false
          - name: test-browser
            command: pnpm test:browser
            php: false
            playwright: true
          - name: build
            command: pnpm build
            php: false
            playwright: false
          - name: security
            command: pnpm security
            php: false
            playwright: false
          - name: delivery
            command: pnpm delivery:check
            php: false
            playwright: false
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: pnpm

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        if: ${{ matrix.php }}
        with:
          php-version: "8.3"
          tools: composer:2.10.3
          coverage: none

      - run: pnpm install --frozen-lockfile
      - if: ${{ matrix.php }}
        run: composer validate --strict --working-dir tools/php-indexer
      - if: ${{ matrix.php }}
        run: composer install --working-dir tools/php-indexer --no-interaction --no-plugins --no-scripts --prefer-dist
      - if: ${{ matrix.playwright }}
        run: |
          # Playwright installs its own Chromium; the runner's Google Chrome
          # repository can be mid-publish and make an unrelated apt update fail.
          sudo rm -f \
            /etc/apt/sources.list.d/google-chrome.list \
            /etc/apt/sources.list.d/google-chrome.sources
          pnpm exec playwright install --with-deps chromium
      - run: ${{ matrix.command }}
